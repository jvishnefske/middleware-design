[package]
name = "middleware-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Code generation for middleware model-based development"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
jsonschema = { version = "0.30", default-features = false }

[dev-dependencies]
trybuild = "1.0"
middleware = { path = "../middleware" }

[lints]
workspace = true
